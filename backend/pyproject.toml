[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-backend"
version = "0.1.0"
description = "TrustLens API — Phase 1 repository bootstrap (health only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Listed for later phases — do NOT import/connect in Phase 1
future = [
  "sqlalchemy>=2.0.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "psycopg2-binary>=2.9.0",
  "huggingface_hub>=0.26.0",
]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
