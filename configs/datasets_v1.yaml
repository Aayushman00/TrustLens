# Pinned Hugging Face datasets for TrustLens FRIES probes (Phase 9).
# Revisions are full git SHAs — do not float on "main" / "latest".
# Phase 25: canonical ids (glue, ag_news, cifar10) re-pinned to their namespaced
# homes — newer `datasets`/Hub reject non-namespaced repo ids. ag_news/cifar10
# SHAs are unchanged (same repos); SST-2 moved from glue to stanfordnlp/sst2.
schema_version: v1
datasets:
  sentiment_fairness:
    hf_path: stanfordnlp/sst2
    revision: 8d51e7e4887a4caaa95b3fbebbf53c0490b58bbb
    modality: nlp
    notes: SST-2 — no protected attribute; do NOT use for DP/EO (Phase 12 uses adult_fairness)
  adult_fairness:
    hf_path: scikit-learn/adult-census-income
    revision: fbeef6ec0e6fd88a5028b94683144000a6b380d5
    modality: tabular
    notes: Adult census; default sensitive_attribute=sex; income class as label
  ag_news_robustness:
    hf_path: fancyzhx/ag_news
    revision: eb185aade064a813bc0b7f42de02595523103ca4
    modality: nlp
    task_type: multiclass_classification
    evaluation_domain: news
    notes: News classification; char-swap robustness (tl-methodology-v1.0)
  sst2_robustness:
    hf_path: stanfordnlp/sst2
    revision: 8d51e7e4887a4caaa95b3fbebbf53c0490b58bbb
    modality: nlp
    task_type: binary_classification
    evaluation_domain: sentiment
    notes: SST-2 binary sentiment; char-swap robustness (tl-methodology-v1.0)
  cifar10_subset:
    hf_path: uoft-cs/cifar10
    revision: 0b2714987fa478483af9968de7c934580d0bb9a2
    modality: vision
    notes: Vision placeholder for future multimodal probes
  hatexplain_fairness:
    hf_path: Hate-speech-CNERG/hatexplain
    revision: f6a8b7de6ec31b30919d2f48cf685400ce61185f
    modality: nlp
    task_type: multiclass_classification
    provenance: "Hub pin Hate-speech-CNERG/hatexplain; rows loaded from canonical GitHub JSON referenced by the Hub loading script"
    fairness:
      default_sensitive_attribute: target_community
      sensitive_attributes:
        - name: target_community
          type: categorical
          pooling_policy: none
      label_field: label
      input_field: text
      min_total_n: 200
      min_group_n: 50
      stratify_on: [label, sensitive_attribute]
      raw_data_urls:
        dataset: https://raw.githubusercontent.com/punyajoy/HateXplain/master/Data/dataset.json
        post_id_divisions: https://raw.githubusercontent.com/punyajoy/HateXplain/master/Data/post_id_divisions.json
    notes: "HateXplain — declared A=target community; offensive content; multiclass labels 0=hatespeech 1=normal 2=offensive"
