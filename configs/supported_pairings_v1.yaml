# Supported model+dataset pairings for model-faithful evaluation (tl-methodology-v1.0).
# Revisions are full git SHAs — do not float on "main" / "latest".
schema_version: v1
pairings:
  - id: hatexplain_bert_v1
    model_ref: Hate-speech-CNERG/bert-base-uncased-hatexplain
    model_revision: e487c81b768c7532bf474bd5e486dedea4cf3848
    task_type: multiclass_classification
    modality: text
    dataset: hatexplain_fairness
    dataset_revision: f6a8b7de6ec31b30919d2f48cf685400ce61185f
    input_adapter: hatexplain_post_tokens_v1
    required_dataset_fields:
      - post_tokens
      - annotators
    output_decoding:
      decision: argmax
      label_space:
        - "hate speech"
        - normal
        - offensive
    preprocessing:
      max_length: 256
      device: cpu
    notes: "First validated TrustLens model-faithful pairing; multiclass — DP/EO not applicable"
