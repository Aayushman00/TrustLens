[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-worker"
version = "0.20.1"
description = "TrustLens worker — Phase 24 (testing hardening; worker behavior unchanged)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "redis>=5.0.0",
  "boto3>=1.35.0",
  "celery>=5.4.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.0",
  "pyyaml>=6.0.0",
  # NLP robustness/fairness inference. Default PyPI wheels for linux x86_64
  # already bundle CUDA runtime libraries — no separate GPU-specific
  # install/index is needed; device selection (CPU vs CUDA) is detected at
  # runtime (app/inference/device.py), not decided by which wheel got
  # installed.
  "torch>=2.2.0",
  "transformers>=4.44.0",
  # Gemini client for app.osd.hybrid.HybridOSDAgent (llm_v1 engine, vendored
  # verbatim from backend/app/osd via Dockerfile.worker) — must be kept in
  # sync with backend/pyproject.toml's dependency of the same name.
  "google-genai>=0.3.0",
  # Groq/NVIDIA NIM fallback calls in app/osd/llm_client.py — was working
  # only via google-genai's own transitive dependency; declared explicitly.
  "httpx>=0.27.0",
]

[project.optional-dependencies]
future = []
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned to the classic default rules — see backend/pyproject.toml for rationale.
select = ["E4", "E7", "E9", "F"]
